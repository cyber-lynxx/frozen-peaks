<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">

        <!--Google font Economica-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Economica:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="style.css">

        <title>Frozen Peaks</title>
    </head>
    <body>
        <!--The ground-->
        <img src="https://i.ibb.co/fVfvnnjh/frost-covered-dirt3.png" class="ground">

        <p class="bg-image-credit">Background image credit: Rohit Tandon</p>

        <div class="square" style="bottom: 15dvh;"></div>

        <img src="https://i.ibb.co/VYLCqQ7S/snowball.png" alt="snowball" class="snowball" style="display: none;" id="snowball">

        <!--"Arrow zones", which show where each arrow key corresponds-->
        <div class="arrow-zone" style="background-color: rgba(127, 127, 184, 0.5); bottom: 17.5dvh;"></div>
        <div class="arrow-zone" style="background-color: rgba(108, 255, 108, 0.5); bottom: 38.125dvh;"></div>
        <div class="arrow-zone" style="background-color: rgba(255, 255, 130, 0.5); bottom: 58.75dvh;"></div>
        <div class="arrow-zone" style="background-color: rgba(255, 147, 183, 0.5); bottom: 79.375dvh;"></div>

        <!--Arrow images-->
        <img class="arrow-image" src="https://i.ibb.co/PvZMgdnM/up-arrow.png" alt="up arrow" style="bottom: 18.8125dvh;">
        <img class="arrow-image" src="https://i.ibb.co/V0kZBJsm/up-arrow.png" alt="left arrow" style="bottom: 40dvh;">
        <img class="arrow-image" src="https://i.ibb.co/dCxX1yW/up-arrow.png" alt="down arrow" style="bottom: 60dvh;">
        <img class="arrow-image" src="https://i.ibb.co/nqZjKs2v/up-arrow.png" alt="right arrow" style="bottom: 81dvh;">

        <div class="threshold-line"></div>
    </body>
</html>
